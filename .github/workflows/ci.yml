name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts || bun install --ignore-scripts
      - run: bun run check
      - run: bun test
      - run: bun run build

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.2"
      - name: Link Bun to standard paths
        run: |
          BUN_PATH=$(which bun)
          sudo ln -sf "$BUN_PATH" /usr/local/bin/bun || true
          if [ -d /opt/homebrew/bin ]; then
            sudo ln -sf "$BUN_PATH" /opt/homebrew/bin/bun || true
          fi
      - name: Build macOS App & Safari Extension
        run: |
          ALLOW_UNSIGNED=1 ./build.sh
      - name: Validate App Bundle & Embedded Extension Structure
        run: |
          test -d "build/RightClickRestore.app"
          test -d "build/RightClickRestore.app/Contents/PlugIns/RightClickRestore Extension.appex"
          test -f "build/RightClickRestore.app/Contents/PlugIns/RightClickRestore Extension.appex/Contents/Resources/manifest.json"
          codesign --verify --deep --strict --verbose=2 "build/RightClickRestore.app"
