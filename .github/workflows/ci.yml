name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun test
      - run: bun run build

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Link Bun to standard paths
        run: |
          BUN_PATH=$(which bun)
          sudo ln -sf "$BUN_PATH" /usr/local/bin/bun || true
          if [ -d /opt/homebrew/bin ]; then
            sudo ln -sf "$BUN_PATH" /opt/homebrew/bin/bun || true
          fi
      - name: Build macOS App & Safari Extension
        run: |
          ALLOW_UNSIGNED=1 ./build.sh
      - name: Validate App Bundle & Embedded Extension Structure
        run: |
          test -d "build/RightClickRestore.app"
          test -d "build/RightClickRestore.app/Contents/PlugIns/RightClickRestore Extension.appex"
          test -f "build/RightClickRestore.app/Contents/PlugIns/RightClickRestore Extension.appex/Contents/Resources/manifest.json"
          codesign --verify --deep --strict --verbose=2 "build/RightClickRestore.app"
