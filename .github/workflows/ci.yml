name: CI

on:
  push:
  pull_request:

jobs:
  web-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test src/**/*.test.ts
      - run: bun run build
