sonar.organization=marspater
sonar.projectKey=marspater_right-click-restore
sonar.projectName=right-click-restore

# Source code and test configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/**/*.test.ts,SafariExtension/**,build/**,**/Resources/**,test_page.html,scripts/**

# Exclude coverage calculation so Quality Gate is not blocked by missing coverage reports
sonar.coverage.exclusions=**

# Source encoding
sonar.sourceEncoding=UTF-8
